{% set name = "dynapydantic" %}
{% set version = "0.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/dynapydantic-{{ version }}.tar.gz
  sha256: 8d7eab11da3b0b632e885766d01b4c20b8d75d54bd9119f403d26a37ab61188c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - pydantic >=2.0

test:
  imports:
    - dynapydantic
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Dyanmic pydantic models
  home: https://github.com/psalvaggio/dynapydantic
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - psalvaggio
